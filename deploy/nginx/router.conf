# Entry point of the stack, reached by Nginx Proxy Manager on the shared docker network.
# Every host (odonto.<domain> and <clinic>.odonto.<domain>) lands here: the API paths go to
# Laravel and everything else to Nuxt. The Host header is kept, because the clinic comes from it.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # Attachments go up to 10 MB.
    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;

    location ~ ^/(api|sanctum)(/|$) {
        proxy_pass http://api:8080;
    }

    location = /up {
        proxy_pass http://api:8080;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

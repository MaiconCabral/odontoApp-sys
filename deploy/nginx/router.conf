# Entry point of the stack, reached by Nginx Proxy Manager on the shared docker network.
# Every host (odonto.<domain> and <clinic>.odonto.<domain>) lands here: the API paths go to
# Laravel and everything else to Nuxt. The Host header is kept, because the clinic comes from it.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Upgrade only on websocket requests, so plain requests keep a normal Connection header.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;

    # Docker's internal DNS. With the upstream in a variable, nginx looks the name up again
    # (at most every 10 s) instead of keeping the IP it found at start. Each deploy recreates
    # api and web with new IPs; without this the router kept sending to the old ones (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;
    set $web http://web:3000;

    # Attachments go up to 10 MB.
    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;

    # proxy_pass with a variable and no path forwards the original URI and query string.
    location ~ ^/(api|sanctum)(/|$) {
        proxy_pass $api;
    }

    location = /up {
        proxy_pass $api;
    }

    location / {
        proxy_pass $web;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
